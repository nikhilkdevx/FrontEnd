<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Feedback Form</h1>
    <form action="/action">
        
            <label for="name" id="name">Name:</label>
            <input type="Text" placeholder="Write your name" id="name">
        <br> <br>
        
            <label for="email" id="email">Email:</label>
            <input type="Text" placeholder="Write your email" id="email">
        <br> <br>
        <label for="message" id="message">Message:</label>
        <textarea for="message" cols="30" rows="4"></textarea>
        <br>
        <label for="Rating" id="Rating">Rate us for 5:</label>
        <br>
         <input type="radio" name="1" id="1" value="1" >
        <label for name="1">1</label>
        <br>
         <input type="radio" name="2" id="2" value="2" >
        <label for name="2">2</label>
        <br>
         <input type="radio" name="3" id="3" value="3" >
        <label for name="3">3</label>
        <br>
         <input type="radio" name="4" id="4" value="4" >
        <label for name="4">4</label>
        <br>
         <input type="radio" name="5" id="5" value="5" >
        <label for name="5">5</label>
        <br>
        <button> Send your message</button>
        

    </form>

</body>
</html>
