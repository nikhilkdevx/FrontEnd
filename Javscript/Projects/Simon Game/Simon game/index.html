<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start the Game</h2>

    <div class = "boxes">
        <div class = "firstline">
            <div class = "btn pink" type ="button" id="pink"></div>
            <div class = "btn orange" type ="button" id="orange"></div>
        </div>
        <div class = "secondline">
            <div class = "btn lightseagreen" type ="button" id ="lightseagreen"></div> 
            <div class = "btn lightblue" type ="button" id="lightblue"></div>
        </div>
        
    </div>
    <div class ="hi"><h2 class="score" id="score">Score </h2></div>
    
       
    <script src ="app.js"></script>
</body>
</html>
