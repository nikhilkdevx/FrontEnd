<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class = "input">
        <input type="text" style="height: 100px; width: 200px; font-size: large;" placeholder="Do Calculations here">  
    </div>
    <div class = "row1" style="display: flex; justify-content: space-between;  width:200px;" >
        <button class="seven">7</button>
        <button class="eight">8</button>
        <button class="nine">9</button>
        <button class="divide">/</button>
    </div>
    <div class = "row2" style="display: flex; justify-content: space-between;  width:200px;">
        <button class="four">4</button>
        <button class="five">5</button>
        <button class="six">6</button>
        <button class="mul">*</button>
    </div>
    <div class = "row3"style="display: flex; justify-content: space-between;  width:200px;">
        <button class="one">1</button>
        <button class="two">2</button>
        <button class="three">3</button>
        <button class="sub">-</button>
    </div>
    <div class = "row4" style="display: flex; justify-content: space-between;  width:200px;">
        <button class="clear">Clear</button>
        <button class="zero">0</button>
        <button class="equal">=</button>
        <button class="add">+</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
